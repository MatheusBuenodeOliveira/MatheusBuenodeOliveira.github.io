<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Matheus Bueno de Oliveira · Senior AI Engineer</title>
  <meta name="description" content="Matheus Bueno de Oliveira, Senior AI Engineer. LLM-powered systems, Agentic AI and cloud data platforms. Explore my career as a neural network, one neuron at a time." />
  <meta name="theme-color" content="#040814" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Matheus Bueno de Oliveira · Senior AI Engineer" />
  <meta property="og:description" content="My career as a neural network. Follow the signal, one neuron at a time." />
  <meta property="og:url" content="https://matheusbuenodeoliveira.github.io/" />
  <meta property="og:image" content="https://matheusbuenodeoliveira.github.io/assets/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=11" />
</head>
<body class="mode-intro">
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- overview: one button per neuron, positioned over the canvas -->
  <nav class="atlas" id="atlas" aria-label="Full network"></nav>

  <!-- close-up: the neuron you are on, with its content inside -->
  <main class="soma" id="soma" aria-live="polite">
    <div class="membrane" aria-hidden="true"></div>
    <div class="soma-scroll" id="somaScroll">
      <article class="soma-inner" id="somaInner"></article>
    </div>
  </main>

  <!-- synapses leaving the current neuron -->
  <div class="synapses" id="synapses"></div>

  <header class="hud-top">
    <button class="brand" id="brand" type="button">
      <span class="brand-name">Matheus Bueno de Oliveira</span>
      <span class="brand-role" data-i18n="role"></span>
    </button>
    <div class="hud-actions">
      <button class="chip" id="netBtn" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><g fill="currentColor"><circle cx="4" cy="10" r="2"/><circle cx="10" cy="4" r="2"/><circle cx="10" cy="16" r="2"/><circle cx="16" cy="10" r="2"/></g><path d="M4 10 10 4 16 10 10 16Z M4 10H16" fill="none" stroke="currentColor" stroke-opacity=".5"/></svg>
        <span id="netLabel"></span>
      </button>
      <button class="chip lang" id="langBtn" type="button">
        <span data-l="en">EN</span><span class="sep">/</span><span data-l="pt">PT</span>
      </button>
    </div>
  </header>

  <footer class="hud-bottom">
    <div class="trail" id="trail"></div>
    <p class="keys mono" id="keys"></p>
    <button class="minimap" id="minimap" type="button"><canvas id="mini" aria-hidden="true"></canvas></button>
  </footer>

  <div class="overview-bar" id="overviewBar">
    <p class="ov-hint" id="ovHint"></p>
    <ul class="legend" id="legend"></ul>
    <button class="chip ghost" id="returnBtn" type="button"></button>
  </div>

  <script src="js/data.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
